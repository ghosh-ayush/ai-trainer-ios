name: Local Python and iOS checks
on:
  push:
    branches: [master, 'feat/**', 'claude/**', 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Lint and type-check the core
        working-directory: core/python
        run: |
          pip install --quiet "ruff>=0.15" "mypy>=1.20"
          ruff check . ../../scripts
          ruff format --check . ../../scripts
          mypy
      - run: PYTHONPATH=core/python python -m unittest discover -s core/python/tests -v
      - name: Generated contracts and Swift models match the spec
        run: |
          python scripts/generate_schemas.py
          python scripts/generate_swift_models.py
          git diff --exit-code -- shared/schemas core/python/ai_trainer apps/ios/Sources/AITrainerCore/Models.swift
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch checksum-pinned development runtime
        run: scripts/setup_python.sh
      - name: Python and Swift tests through embedded CPython
        run: scripts/test.sh
      - name: Verify generated Xcode project builds
        run: python3 scripts/generate_project.py
      - name: Build and exercise simulator runtime
        run: |
          set -o pipefail
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild -project apps/ios/App/AITrainer.xcodeproj -scheme AITrainer -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build | tee ios-debug.log
          scripts/smoke_ios.sh "$simulator_id"
      - name: Build Release simulator
        run: |
          set -o pipefail
          xcodebuild -project apps/ios/App/AITrainer.xcodeproj -scheme AITrainer -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build | tee ios-release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: ios-*.log
