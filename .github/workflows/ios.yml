name: iOS and domain checks
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Domain behavior tests
        run: swift test
      - name: Reproducible project generation
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- iOS/AITrainer.xcodeproj
      - name: Build iOS Simulator Debug
        run: |
          set -o pipefail
          xcodebuild -project iOS/AITrainer.xcodeproj -scheme AITrainer -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee ios-debug.log
      - name: Build iOS Simulator Release
        run: |
          set -o pipefail
          xcodebuild -project iOS/AITrainer.xcodeproj -scheme AITrainer -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee ios-release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: ios-*.log
