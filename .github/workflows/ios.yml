name: Local Python and iOS checks
on:
  push:
    branches: [master]   # PR branches are covered by pull_request; listing them here ran everything twice
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    # Lets the macOS jobs skip docs-only changes. A skipped job still satisfies a required
    # status check. Pushes to master always run everything. Add any new top-level path
    # that feeds the iOS build to this list.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'apps/**'
              - 'core/**'
              - 'shared/**'
              - 'scripts/**'
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/ios.yml'
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Lint and type-check the core
        working-directory: core/python
        run: |
          pip install --quiet "ruff==0.16.8" "mypy==2.3.1"  # pinned: tool drift must not break master
          ruff check . ../../scripts
          ruff format --check . ../../scripts
          mypy
      - run: PYTHONPATH=core/python python -m unittest discover -s core/python/tests -v
      - name: Generated contracts and Swift models match the spec
        run: |
          python scripts/generate_schemas.py
          python scripts/generate_swift_models.py
          git diff --exit-code -- shared/schemas core/python/ai_trainer apps/ios/Sources/AITrainerCore/Models.swift
  swift-tests:
    # Desktop `swift test` linked against the same CPython version the app embeds.
    needs: changes
    if: needs.changes.outputs.ios == 'true' || github.ref == 'refs/heads/master'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch checksum-pinned development runtime
        run: scripts/setup_python.sh
      - name: Python and Swift tests through embedded CPython
        run: scripts/test.sh
  simulator:
    # Runs in parallel with swift-tests. The simulator boots in the background while the
    # Debug build runs; the build itself does not need a booted device, only install/launch do.
    needs: changes
    if: needs.changes.outputs.ios == 'true' || github.ref == 'refs/heads/master'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start booting an iPhone simulator
        id: simulator
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator_id" || true   # bootstatus -b below finishes or retries the boot
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Fetch checksum-pinned development runtime
        run: scripts/setup_python.sh
      - name: Build Debug simulator
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project apps/ios/App/AITrainer.xcodeproj -scheme AITrainer -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build | tee ios-debug.log
      - name: Exercise the Debug app on the simulator
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          scripts/smoke_ios.sh "$SIMULATOR_ID"
      - name: Build Release simulator (one architecture on pull requests, all architectures on master)
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            destination='generic/platform=iOS Simulator'
            architectures=''
          else
            destination="platform=iOS Simulator,id=$SIMULATOR_ID"
            architectures='ONLY_ACTIVE_ARCH=YES'
          fi
          xcodebuild -project apps/ios/App/AITrainer.xcodeproj -scheme AITrainer -configuration Release -sdk iphonesimulator -destination "$destination" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO $architectures build | tee ios-release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: ios-*.log
