name: One-time Word specification import
on:
  push:
    branches: [docs/import-word-spec-20260917]
    paths: [.document-import/payload.xz.b64]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install python-docx==1.2.0
      - name: Restore and verify the original document
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, html, json, lzma, re, zipfile, docx
          payload = json.loads(lzma.decompress(base64.b64decode(Path('.document-import/payload.xz.b64').read_text())))
          md = Path('docs/AI_Trainer_01_Athlete_State_and_Training_Brain.md').read_text()
          out = Path('docs/AI_Trainer_01_Athlete_State_and_Training_Brain.docx')
          base = Path(docx.__file__).parent / 'templates/default.docx'
          with zipfile.ZipFile(base) as b, zipfile.ZipFile(out, 'w') as z:
              for entry in payload['entries']:
                  m = entry['meta']; name = m['filename']; kind = entry['kind']
                  if kind == 'copy':
                      data = b.read(name)
                  elif kind == 'doc':
                      refs = entry['refs']
                      def text(match):
                          start, length = refs[int(match.group(1))]
                          return html.escape(md[start:start+length], quote=False)
                      data = re.sub(r'__DOC_TEXT_(\d+)__', text, entry['skeleton']).encode()
                  elif kind == 'delta':
                      orig = re.findall(r'<[^>]+>|[^<]+', b.read(name).decode())
                      data = ''.join(''.join(orig[x[0]:x[1]]) if isinstance(x, list) else x for x in entry['ops']).encode()
                  elif kind == 'bytes_delta':
                      orig = b.read(name)
                      data = b''.join(orig[x[0]:x[0]+x[1]] if isinstance(x, list) else x.encode() for x in entry['ops'])
                  elif kind == 'literal':
                      data = entry['text'].encode()
                  else:
                      raise ValueError('Unsupported entry')
                  info = zipfile.ZipInfo(name, tuple(m['date_time']))
                  for key, value in m.items():
                      if key in ('filename', 'date_time'):
                          continue
                      setattr(info, key, base64.b64decode(value) if key in ('extra', 'comment') else value)
                  z.writestr(info, data)
          expected = '677e043e57c005af2c438fd9528d5bb77cf4db2efcfe371a4ad121d519bb6712'
          actual = hashlib.sha256(out.read_bytes()).hexdigest()
          assert actual == expected, f'Checksum mismatch: {actual}'
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
          print('Verified original Word file:', actual)
          PY
      - name: Commit verified file on import branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AI_Trainer_01_Athlete_State_and_Training_Brain.docx
          git commit -m 'docs: import original Word specification with verified checksum'
          git push origin HEAD:docs/import-word-spec-20260917
