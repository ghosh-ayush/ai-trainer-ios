[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trainer-core"
version = "0.1.0"
description = "Offline deterministic AI Trainer domain core"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.package-data]
ai_trainer = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012"]
# User-facing copy uses these typographic characters on purpose ("20 kg × 8", "RIR 1–2").
allowed-confusables = ["×", "–"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
packages = ["ai_trainer"]
